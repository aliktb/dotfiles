set-option -sa terminal-overrides ",xterm*:Tc"

# Enable mouse mode
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Extend pane number timeout
set -g display-panes-time 5000


# Plugins

## TPM is required to be installed first
set -g @plugin 'tmux-plugins/tpm'

## List of plugins
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
# Use tmux window names and highlight the active window number in peach.
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_current_number_color '#{@thm_peach}'
tmux_peach="#ef9f76"
tmux_pink="#f4b8e4"

set -g @catppuccin_directory_color "$tmux_peach"
set -g @catppuccin_application_color "$tmux_pink"

# Expand the modules when tmux draws the status bar, after TPM loads Catppuccin.
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'


# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Opens in current directory when creating new pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Bootstrap TPM in the same XDG directory it uses for the other plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell '~/.config/tmux/plugins/tpm/tpm'
